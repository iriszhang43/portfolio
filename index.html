        animation: float 12s linear infinite;

        from {
            transform: translateX(0);

        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

        display: flex;
        justify-content: center;

    }

    .grid-item figure {
        display: block;
        margin: 0;
        width: 100%;
        margin-bottom: 20px;
    }

    img,
    .image {
        width: 100%;
        border-radius: 1.25rem;
        transition: all 0.25s ease-in-out;
    }

    .image:hover {
        box-shadow: var(--shadow);
    }

    .caption {
        text-decoration: none;
        color: var(--text);
    }

    .title {
        font-weight: 600;
        font-size: 1.25rem;
        margin-bottom: 0.4rem;
    }

    .description {
        font-size: 1rem;
    }

    .photoitem {
        border-radius: 1.25rem;
        overflow: auto;
        cursor: auto;
        pointer-events: none;
        aspect-ratio: 1/1;
        width: 300px;
        height: auto;
        margin: 0.5rem
    }

    .photoitem img {
        display: block;
        aspect-ratio: 1/1;
        object-fit: cover;
    }

    .shutter {
        display: block;
        margin: -1rem auto 2rem;
        align-items: center;
        font-size: 3rem;
        font-weight: 800;
        border: none;
        background: transparent;
        color: var(--text);
        cursor: pointer;
    }

    .shutter:hover {
        transform: scale(1.2);
        transition: transform 0.25s ease-in-out;
    }

    .shutter:active {
        transform: scale(0.98);
        transition: transform 0.07s ease-in-out;
    }

    @keyframes pop {
        0% {
            transform: scale(0.98);
            opacity: 0.5;
        }

        100% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .photothumbnail>* {
        animation: none;
    }

    .photothumbnail.shuffling>* {
        animation: pop 0.15s ease;
    }


    .contact a {
        color: var(--muted);
        text-decoration: none;
    }

    .contact a:hover {
        text-decoration: none;
        color: var(--text);
    }

    .contact .container {
        text-align: center;
    }

    .contactdropdown {
        list-style: none;
        padding: 0;
        margin: 1rem 0 0;
        text-align: center;
    }

    .contactdropdown>li {
        margin: 0.25rem 0;
    }

    .contactdropdown details {
        display: inline-block;
        width: 100%;
        text-align: center;
    }

    .contactdropdown summary {
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        outline: none;
        list-style: none;
        color: var(--muted);
        transition: color 0.2s ease;
    }

    .contactdropdown summary:hover {
        color: var(--text);
    }

    .contactdropdown summary::after {
        content: " ▼";
    }

    .contactdropdown details[open]>summary::after {
        content: " ▲";
    }

    .contact-form {
        margin: 1rem auto 0;
        display: inline-flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 28rem;
        text-align: left;
    }

    .contact-form label {
        font-weight: 400;
        color: var(--muted);
    }

    .contact-form input,
    .contact-form textarea {
        width: 100%;
        padding: 0.6rem;
        font-size: 1rem;
        border: 1px solid var(--muted);
        border-radius: 0.5rem;
    }

    input:focus {
        border-color: var(--text);
        outline: none;
    }

    textarea:focus {
        border-color: var(--text);
        outline: none;
    }

    .contact-form button {
        align-self: center;
        padding: 0.6rem 1rem;
        border: none;
        background: none;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: "ff-speak-web", sans-serif;
        font-size: 1rem;
    }

    .contact-form button:hover {
        color: var(--text);
    }
</style>
