<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/smk3ids.css">

    <title>Iris Zhang's Portfolio</title>
</head>

<style>
    .archive-layout {
        display: grid;
        grid-template-columns: 1fr 2.5fr;
        gap: 0;
    }

    body.landing-open {
        overflow: hidden;
    }

    .landing {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--bg);
        transition: opacity 220ms ease, transform 220ms ease;
    }

    .landing.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-8px);
    }

    .landing-inner {
        width: 100%;
        max-width: 42rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    .landing-inner h1 {
        margin: 0;
        font-size: clamp(2rem, 1rem, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.02em;
    }

    .landing-inner p {
        margin: 0;
        font-size: clamp(1rem, 1.4vw, 1.25rem);
        line-height: 1.6;
        color: var(--muted);
    }

    .start-btn {
        align-self: center;
        padding: 0.9rem 1.4rem;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-family: "ff-speak-web", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 0.06em;
        transition: all 1.5s ease;
    }

    .start-btn:hover {
        color: var(--text);
    }

    .start-btn:active {
        transform: translateY(0px);
    }

    .start-btn:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
    }

    .archive-left {
        position: sticky;
        top: 64px;
    }

    #pieceList {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: .25rem;
    }

    #pieceList li {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 2.5rem;
        text-transform: uppercase;
        display: block;
        width: fit-content;
        cursor: pointer;
        color: var(--muted);
        transition: all 0.15s ease-in-out;
    }

    #pieceList li:hover {
        color: var(--text);
    }

    #pieceList li.active {
        color: var(--text);
    }

    .left-inner {
        padding: 3rem;
        width: 100%;
        position: sticky;
        top: 50px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .archive-right {
        height: calc(100vh - 64px);
        overflow-y: auto;
    }


    .grid {
        display: grid;
        grid-template-columns: 1fr;
        grid-gap: 2.5em;
        padding: 3rem;
    }

    .grid-item figure {
        display: block;
        margin: 0;
        width: 100%;
        margin-bottom: 20px;
    }

    img,
    .image {
        width: 100%;
        border-radius: 1.25rem;
        transition: all 0.25s ease-in-out;
    }

    .image:hover {
        box-shadow: var(--shadow);
    }

    .caption {
        text-decoration: none;
        color: var(--text);
    }

    .title {
        font-weight: 600;
        font-size: 1.25rem;
        margin-bottom: 0.4rem;
    }

    .description {
        font-size: 1rem;
    }
</style>

<body>
    
    <main id="main">
        <div id="landing" class="landing" role="dialog" aria-modal="true" aria-label="Welcome">
            <div class="landing-inner">
                <h1>Hi, I'm Iris, and welcome to my world!</h1>
                <p>Explore my selected work, experiments, and projects.</p>
                <a class="start-btn" href="work/index.html">▶︎ Start</a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
