<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/smk3ids.css">

    <script src="../script.js"></script>

    <title>What I Do</title>

<style>
    .archive-layout {
  display: grid;
  grid-template-columns: 1fr 2.5fr;
  gap: 0;
}

.archive-left { position: sticky; top: 64px; }

#pieceList {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: .25rem;
}

#pieceList li {
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 2.5rem;
        text-transform: uppercase;
        display: block;
        width: fit-content;
        cursor: pointer;
        color: var(--muted);
        transition: all 0.15s ease-in-out;
}

#pieceList li:hover { color: var(--text); }

#pieceList li.active {
  color: var(--text);
}

.left-inner {
  padding: 3rem;        
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.archive-right {
  height: calc(100vh - 64px);
  overflow-y: auto;
}


    .grid {
        display: grid;
        grid-template-columns: 1fr;
        grid-gap: 2.5em;
        padding: 3rem;
    }

    .grid-item figure {
        display: block;
        margin: 0;
        width: 100%;
        margin-bottom: 20px;
    }

    img,
    .image {
        width: 100%;
        border-radius: 1.25rem;
        transition: all 0.25s ease-in-out;
    }

    .image:hover {
        box-shadow: var(--shadow);
    }

    .caption {
        text-decoration: none;
        color: var(--text);
    }

    .title {
        font-weight: 600;
        font-size: 1.25rem;
        margin-bottom: 0.4rem;
    }

    .description {
        font-size: 1rem;
    }
</style>

<body>

                    <li><a href="../Archive/index.html">Archive</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main">
        <div class="archive-layout">
                <aside class="archive-left">
      <div class="left-inner">
        <nav id="workcatalogue" class="grid-item">
            <ul id="pieceList"></ul>
          </nav>
      </div>
    </aside>
            <section class="archive-right">
                <div class="grid">
                    <div class="grid-item">
                        <a href="../project/25 Variations/index.html">
                            <figure class="image">
                                <img src="../image/workthumbnail/25 Variations.png">
                            </figure>
                        </a>
                        <a href="../project/25 Variations/index.html" class="caption">
                            <div class="title">
                                25 Variations
                            </div>
                            <div class="description">Web Design • 2025</div>
                        </a>
                    </div>
                    <div class="grid-item">
                        <a href="../project/Laba Congee Recipe/index.html">
                            <figure class="image">
                                <img src="../image/workthumbnail/Laba Congee Recipe.png">
                            </figure>
                        </a>
                        <a href="../project/Laba Congee Recipe/index.html" class="caption">
                            <div class="title">
                                Laba Congee Recipe
                            </div>
                            <div class="description">Web Design • 2025</div>
                        </a>
                    </div>
            </section>
        </div>
        </section>
    </main>

</body>
